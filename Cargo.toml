[package]
name = "opsin"
version = "0.0.1"
edition = "2024"
description = "Spectral image viewer and converter, with the minimal edits a viewer earns: exposure, rotation, starring, culling. The observer is a variable. Full editing belongs to a separate crate."
license-file = "LICENSE"
repository = "https://github.com/nickspiker/opsin"
keywords = ["spectral", "image", "viewer", "raw", "vsf"]
categories = ["multimedia::images"]
# The hero webp renders in the README via its raw URL; the orb .rgb is a make_orb intermediate. Neither ships. The orb .vsf DOES ship (include_bytes! in app.rs).
exclude = ["opsin.webp", "assets/opsin_orb.rgb", "assets/test"]

[dependencies]
# Container format — VSF-Image sections (sensor plane, spectral characterization, provenance chain).
vsf = { version = "0.9.3", path = "../vsf", features = ["inspect", "rayon"] }
# Sensor intake — decodes RAW/DNG to counts + gives us both DNG ColorMatrices and illuminant codes to build the tiered colour_profile.
limbus = { version = "0.0.1", path = "../limbus" }
# CPU softbuffer compositor — hosts the viewer's event loop, chrome, paint primitives. Same dep shape as Photon's desktop block.
fluor = { version = "0.0.4", path = "../fluor", default-features = false, features = ["std", "text", "simd", "rayon"], optional = true }
rayon = "1.12.0"
chameleon = { path = "../chameleon", optional = true }
v4l = { version = "0.14", optional = true }
jpeg-encoder = "0.7"
jxl-oxide = "0.12.6"
zune-jpeg = "0.5.15"
zune-core = "0.5.3"
# WebP ingest (2026-09-15): pure-Rust lossy + lossless decoder, already in the graph thru limbus → rawler → image; same untagged-sRGB convention as the JPEG path.
image-webp = "0.2"

# LIBRARY + VIEWER (2026-09-11): photon renders its attachments thru opsin's colour pipeline (convert + render) and must not drag the winit host into an Android build, so the viewer's host dependency sits behind the default `viewer` feature; `default-features = false` gives a library of just the pipeline.
[features]
default = ["viewer"]
# The embeddable viewer (`view` + `panel` modules) on fluor WITHOUT a window host — what photon builds on every platform, Android included.
view = ["dep:fluor"]
# The opsin window: the view plus fluor's winit host and the single-instance socket.
viewer = ["view", "fluor/host-winit"]
# Target-scan calibration thru chameleon (closed source, sibling path crate): the Cal pill / K key scans the current frame for a VERICHROME target and pastes the resulting DSR IDT. Off by default so opsin builds and ships without chameleon.
calibrate = ["dep:chameleon"]
# Live: a V4L2 MJPEG camera as the frame source — opsin is the viewfinder, a 3×3 (+gain) matrix corrects it, and the corrected stream goes out thru ffmpeg to a v4l2loopback device (/dev/video10) for whatever app wants a calibrated webcam. Open source on its own; with `calibrate` too, K scans a held-up target and solves the matrix.
live = ["dep:v4l"]

# macOS document opens: Finder delivers a double-clicked file as an Apple Event, never in argv, and only the application delegate catches the one that arrives during launch — so opsin adds a method to winit's delegate class through the ObjC runtime (see src/mac_open.rs). Same version fluor already pulls on this target, so nothing new enters the graph.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSURL"] }

[lib]
name = "opsin"
path = "src/lib.rs"

[[bin]]
name = "opsin"
path = "src/main.rs"
required-features = ["viewer"]
